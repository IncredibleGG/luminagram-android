name: Android

on:
  push:
    branches: [ features ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (build-tools / platform / NDK / cmake)
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Gradle build (afatFull debug)
        run: ./gradlew :TMessagesProj_AppStandalone:assembleAfatFullDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp TMessagesProj_AppStandalone/build/outputs/apk/afatFull/debug/*.apk out/LuminaGram-android-debug.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaGram-android-debug
          path: out/LuminaGram-android-debug.apk
          if-no-files-found: error
